<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mnemosyne — Dynamic View</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #05050c; overflow: hidden; font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    canvas { display: block; }

    #tooltip {
      position: fixed; display: none;
      background: rgba(5,5,15,0.93); border: 1px solid currentColor;
      padding: 8px 12px; border-radius: 3px; font-size: 11px;
      pointer-events: none; z-index: 10;
      max-width: 380px; white-space: pre-wrap; word-break: break-word; line-height: 1.55; letter-spacing: 0.04em;
    }
    #legend { position: fixed; bottom: 18px; left: 18px; display: flex; flex-direction: column; gap: 5px; z-index: 10; max-height: 70vh; overflow-y: auto; }
    .legend-item { display: flex; align-items: center; gap: 7px; font-size: 10px; color: rgba(255,255,255,0.45); letter-spacing: 0.05em; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    #hint { position: fixed; bottom: 18px; right: 18px; font-size: 10px; color: rgba(255,255,255,0.2); letter-spacing: 0.08em; z-index: 10; text-align: right; line-height: 1.6; }

    #topbar { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; z-index: 10; }
    .vbtn {
      background: rgba(5,5,15,0.8); border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.3); padding: 5px 14px;
      font-family: inherit; font-size: 10px; letter-spacing: 0.1em;
      cursor: pointer; border-radius: 3px; text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s;
    }
    .vbtn.active { border-color: rgba(0,255,136,0.6); color: rgba(0,255,136,0.9); }
    .vbtn-sep { color: rgba(255,255,255,0.1); font-size: 14px; }

    #rotateBtn {
      position: fixed; top: 14px; right: 18px;
      background: rgba(5,5,15,0.75); border: 1px solid rgba(0,255,136,0.45);
      color: rgba(0,255,136,0.7); padding: 5px 12px;
      font-family: inherit; font-size: 10px; letter-spacing: 0.1em;
      cursor: pointer; border-radius: 3px; z-index: 10;
    }
    #rotateBtn.paused { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.35); }
    #viz-nav { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:2px; z-index:100; background:rgba(5,5,15,0.88); border:1px solid rgba(255,255,255,0.08); border-radius:20px; padding:4px 6px; font-family:'JetBrains Mono','Fira Code',monospace; }
    #viz-nav a { color:rgba(255,255,255,0.3); text-decoration:none; font-size:9px; letter-spacing:0.1em; padding:4px 12px; border-radius:15px; transition:color 0.2s; }
    #viz-nav a:hover { color:rgba(255,255,255,0.8); }
    #viz-nav a.active { background:rgba(0,255,136,0.08); color:rgba(0,255,136,0.85); }

    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: rgba(0,255,136,0.4); letter-spacing: 0.18em; z-index: 20; }
  </style>
</head>
<body>
  <div id="loading">LOADING&hellip;</div>
  <div id="topbar" style="display:none">
    <button class="vbtn active" id="btnA">Semantic Clusters</button>
    <span class="vbtn-sep">|</span>
    <button class="vbtn" id="btnB">Projects</button>
  </div>
  <div id="tooltip"></div>
  <div id="legend"></div>
  <div id="hint">drag &bull; scroll to zoom<br>zoom into node to read messages</div>
  <button id="rotateBtn">⟳ AUTO-ROTATE</button>
  <nav id="viz-nav">
    <a href="/mnemosyne-viz-original.html">Original</a>
    <a href="/mnemosyne-viz.html">Live</a>
    <a href="/mnemosyne-viz-live.html">Explorer</a>
    <a href="/mnemosyne-viz-dynamic.html">Dynamic</a>
  </nav>
  <script>document.querySelectorAll('#viz-nav a').forEach(a=>{if(a.getAttribute('href')===window.location.pathname)a.classList.add('active');});</script>

  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const loadEl = document.getElementById('loading');

    // ── Load data ─────────────────────────────────────────────────────────────
    let topo, ptsData;
    try {
      loadEl.textContent = 'LOADING…';
      const [tr, pr] = await Promise.all([
        fetch('/mnemosyne-topology.json',{cache:'no-cache'}),
        fetch('/mnemosyne-points.json',{cache:'no-cache'}).catch(() => null),
      ]);
      if (!tr.ok) throw new Error('topology ' + tr.status);
      topo    = await tr.json();
      ptsData = pr && pr.ok ? await pr.json() : null;
    } catch (e) { loadEl.textContent = 'Failed: ' + e.message; throw e; }
    loadEl.style.display = 'none';
    document.getElementById('topbar').style.display = '';

    const K        = topo.k;
    const clusters = topo.clusters;
    const saddles  = topo.saddle_points;
    const maxClSize = Math.max(...clusters.map(c => c.size));

    // ── Color palettes ────────────────────────────────────────────────────────
    const MIN_PROJECT_MSGS = 10; // projects below this are too small to place as nodes
    const PALETTE = [0x00ff88,0x00c8ff,0xff3d71,0xffb300,0xb388ff,0xff6b35,0x00e5d0,0xff5f5f,0xa8ff78,0xffd700,0x00b4d8,0xf72585];

    function makeRNG(seed) { let s=seed>>>0; return ()=>{s=Math.imul(1664525,s)+1013904223>>>0; return s/0x100000000;}; }
    const rng    = makeRNG(42);
    const rngPts = makeRNG(1337);
    const rngPr  = makeRNG(7919);

    function colorHex(col) { return '#' + col.getHexString(); }
    function projectName(raw) { return (raw||'').replace(/^-home-[^-]+-projects-/,'').trim()||raw||''; }
    function clamp(v,lo,hi) { return Math.max(lo,Math.min(hi,v)); }

    // ── Force layout (cluster) ────────────────────────────────────────────────
    function forceLayout(clusters, iters=700) {
      const n=clusters.length, SCALE=11;
      const pos=clusters.map(()=>{const theta=rng()*Math.PI*2,phi=Math.acos(2*rng()-1),r=3+rng()*2;return[r*Math.sin(phi)*Math.cos(theta),r*Math.sin(phi)*Math.sin(theta),r*Math.cos(phi)];});
      const D=Array.from({length:n},()=>new Float32Array(n));
      for (let i=0;i<n;i++) for (const [jStr,d] of Object.entries(clusters[i].inter_cluster_dists)){const j=+jStr;D[i][j]=d;D[j][i]=d;}
      const vel=clusters.map(()=>[0,0,0]);
      for (let iter=0;iter<iters;iter++){
        const F=clusters.map(()=>[0,0,0]);
        for (let i=0;i<n;i++){
          for (let j=i+1;j<n;j++){const dx=pos[j][0]-pos[i][0],dy=pos[j][1]-pos[i][1],dz=pos[j][2]-pos[i][2];const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+1e-6;const mag=0.12*(d-D[i][j]*SCALE)-16/(d*d);const fx=mag*dx/d,fy=mag*dy/d,fz=mag*dz/d;F[i][0]+=fx;F[i][1]+=fy;F[i][2]+=fz;F[j][0]-=fx;F[j][1]-=fy;F[j][2]-=fz;}
          F[i][0]-=0.008*pos[i][0];F[i][1]-=0.008*pos[i][1];F[i][2]-=0.008*pos[i][2];
        }
        for (let i=0;i<n;i++){vel[i][0]=(vel[i][0]+F[i][0])*0.84;vel[i][1]=(vel[i][1]+F[i][1])*0.84;vel[i][2]=(vel[i][2]+F[i][2])*0.84;pos[i][0]+=vel[i][0];pos[i][1]+=vel[i][1];pos[i][2]+=vel[i][2];}
      }
      return pos;
    }
    const clusterPos    = forceLayout(clusters);
    const clusterPosVec = clusterPos.map(([x,y,z])=>new THREE.Vector3(x,y,z));

    // ── Project data ──────────────────────────────────────────────────────────
    // Per-cluster lists (view A) and per-project lists (view B)
    const byCluster = Array.from({length:K},()=>[]); // [[text,project,ci,sub],...]
    const byProject = {};                              // proj → [[text,project,ci,sub],...]

    const projectColor = new Map();
    let projEntries = []; // sorted [proj, {total, pos, pi}]

    if (ptsData) {
      // Count per project
      const counts = {};
      for (const [ci,text,project,sub] of ptsData.points) {
        counts[project] = (counts[project]||0)+1;
        byCluster[ci].push([text,project,ci,sub]);
        (byProject[project]=byProject[project]||[]).push([text,project,ci,sub]);
      }

      // Assign project colors by frequency rank
      const sortedProj = Object.entries(counts).sort((a,b)=>b[1]-a[1]).filter(([,c])=>c>=MIN_PROJECT_MSGS);
      sortedProj.forEach(([p],i)=>{
        projectColor.set(p, new THREE.Color().setHSL(i/sortedProj.length,0.78,0.60));
      });

      // Compute project centroid positions from cluster positions
      const projPositions = {};
      for (const [proj,msgs] of Object.entries(byProject)) {
        if (!projectColor.has(proj)) continue;
        let x=0,y=0,z=0;
        for (const [,,ci] of msgs) { x+=clusterPos[ci][0]; y+=clusterPos[ci][1]; z+=clusterPos[ci][2]; }
        projPositions[proj] = [x/msgs.length, y/msgs.length, z/msgs.length];
      }

      // Spread overlapping project nodes with a repulsion pass
      const projKeys = [...projectColor.keys()];
      const projPos  = projKeys.map(p=>[...projPositions[p]]);
      for (let iter=0;iter<150;iter++){
        const F=projPos.map(()=>[0,0,0]);
        for (let i=0;i<projPos.length;i++) for (let j=i+1;j<projPos.length;j++){
          const dx=projPos[j][0]-projPos[i][0],dy=projPos[j][1]-projPos[i][1],dz=projPos[j][2]-projPos[i][2];
          const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+1e-6;
          if (d<3.0){const mag=0.4*(3.0-d)/d;F[i][0]-=mag*dx;F[i][1]-=mag*dy;F[i][2]-=mag*dz;F[j][0]+=mag*dx;F[j][1]+=mag*dy;F[j][2]+=mag*dz;}
        }
        for (let i=0;i<projPos.length;i++){projPos[i][0]+=F[i][0]*0.5;projPos[i][1]+=F[i][1]*0.5;projPos[i][2]+=F[i][2]*0.5;}
      }

      const maxProjSize = Math.max(...projKeys.map(p=>byProject[p].length));
      projEntries = projKeys.map((proj,pi)=>({
        proj, pi, pos: projPos[pi], color: projectColor.get(proj),
        total: byProject[proj].length, maxProjSize,
      }));
    }

    // ── Scene ─────────────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05050c);
    scene.fog = new THREE.FogExp2(0x05050c, 0.013);
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 300);
    camera.position.set(4, 6, 30);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    scene.add(new THREE.AmbientLight(0x0a0a1a, 6));
    clusters.forEach((cl,i)=>{ const pl=new THREE.PointLight(PALETTE[i%PALETTE.length],1.3,24,2); pl.position.set(...clusterPos[i]); scene.add(pl); });

    // Stars (persistent)
    { const count=2800,pos=new Float32Array(count*3); for (let i=0;i<count*3;i++) pos[i]=(rng()-0.5)*180;
      const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
      scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:0.07,transparent:true,opacity:0.5}))); }

    // Groups for view A (clusters) and view B (projects)
    const viewAGroup = new THREE.Group();
    const viewBGroup = new THREE.Group();
    scene.add(viewAGroup, viewBGroup);
    viewBGroup.visible = false;

    // ── View A: Cluster nodes ─────────────────────────────────────────────────
    const clNodeMesh   = [];  // for LOD opacity
    const viewANodes   = [];  // for raycasting (cluster + saddle)
    const clInstMesh   = Array(K).fill(null);
    const clLineSeg    = Array(K).fill(null);
    const clMeta       = Array(K).fill(null);
    const sphereGeo    = new THREE.SphereGeometry(0.055, 5, 3);
    const dummy        = new THREE.Object3D();

    clusters.forEach((cl,i)=>{
      const col=new THREE.Color(PALETTE[i%PALETTE.length]);
      const radius=(0.22+(cl.size/maxClSize)*0.38)*0.25;
      const mat=new THREE.MeshPhongMaterial({color:col,emissive:col,emissiveIntensity:0.45,shininess:80,transparent:true,opacity:0.9});
      const mesh=new THREE.Mesh(new THREE.SphereGeometry(radius,14,10),mat);
      mesh.position.set(...clusterPos[i]); viewAGroup.add(mesh); clNodeMesh[i]=mesh;
      const hMat=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.10});
      const halo=new THREE.Mesh(new THREE.TorusGeometry(radius*2.8,0.012,6,48),hMat);
      halo.position.set(...clusterPos[i]); halo.rotation.set(rng()*Math.PI,rng()*Math.PI,0); viewAGroup.add(halo);
      const shortLabel=cl.label.split(' · ').slice(0,3).join(' / ');
      viewANodes.push({mesh,label:`${cl.size.toLocaleString()} msgs  ·  ${shortLabel}`,type:'cluster',baseEmissive:0.45,color:col});
    });

    // Inter-cluster edges (view A)
    { const v=[]; for (let i=0;i<K;i++) for (const [jStr] of Object.entries(clusters[i].inter_cluster_dists)){const j=+jStr;if(j>i)v.push(...clusterPos[i],...clusterPos[j]);}
      const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
      viewAGroup.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x223333,transparent:true,opacity:0.12}))); }

    // Saddle nodes (view A)
    const saddleVerts=[];
    saddles.forEach(sp=>{
      const [ci1,ci2]=sp.clusters; if(ci1>=K||ci2>=K) return;
      const pA=clusterPos[ci1],pB=clusterPos[ci2],t=sp.saddle_t??0.5;
      const mx=pA[0]+t*(pB[0]-pA[0])+(rng()-0.5)*0.5,my=pA[1]+t*(pB[1]-pA[1])+(rng()-0.5)*0.5,mz=pA[2]+t*(pB[2]-pA[2])+(rng()-0.5)*0.5;
      const mat=new THREE.MeshPhongMaterial({color:new THREE.Color(0xbbbbdd),emissive:new THREE.Color(0x8888aa),emissiveIntensity:0.08,shininess:140,transparent:true,opacity:0.25+sp.void_score*0.22});
      const mesh=new THREE.Mesh(new THREE.SphereGeometry(0.08+sp.void_score*0.12,8,6),mat);
      mesh.position.set(mx,my,mz); viewAGroup.add(mesh);
      const lA=clusters[ci1].label.split(' · ').slice(0,2).join('/'), lB=clusters[ci2].label.split(' · ').slice(0,2).join('/');
      viewANodes.push({mesh,label:`void ${sp.void_score.toFixed(2)}  ·  ${lA} ↔ ${lB}`,type:'saddle',baseEmissive:0.08,voidScore:sp.void_score});
      saddleVerts.push(pA[0],pA[1],pA[2],mx,my,mz,mx,my,mz,pB[0],pB[1],pB[2]);
    });
    { const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(saddleVerts,3));
      viewAGroup.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x334466,transparent:true,opacity:0.18}))); }

    // View A message clouds: project-colored spheres, project-chained connections
    if (ptsData) {
      byCluster.forEach((msgs,ci)=>{
        if (!msgs.length) return;
        const jitterR=0.5+(clusters[ci].size/maxClSize)*1.8;
        const pos=new Float32Array(msgs.length*3);
        for (let m=0;m<msgs.length;m++){const theta=rngPts()*Math.PI*2,phi=Math.acos(2*rngPts()-1),r=rngPts()*jitterR;pos[m*3]=clusterPos[ci][0]+r*Math.sin(phi)*Math.cos(theta);pos[m*3+1]=clusterPos[ci][1]+r*Math.sin(phi)*Math.sin(theta);pos[m*3+2]=clusterPos[ci][2]+r*Math.cos(phi);}
        const mat=new THREE.MeshPhongMaterial({color:0xffffff,shininess:70,transparent:true,opacity:0.0});
        const inst=new THREE.InstancedMesh(sphereGeo,mat,msgs.length); inst.renderOrder=1;
        for (let m=0;m<msgs.length;m++){dummy.position.set(pos[m*3],pos[m*3+1],pos[m*3+2]);dummy.updateMatrix();inst.setMatrixAt(m,dummy.matrix);inst.setColorAt(m,projectColor.get(msgs[m][1])??new THREE.Color(0.5,0.5,0.5));}
        inst.instanceMatrix.needsUpdate=true; inst.instanceColor.needsUpdate=true;
        viewAGroup.add(inst); clInstMesh[ci]=inst; clMeta[ci]=msgs;
        // Project-colored connection chains
        const byProj={};
        msgs.forEach(([,project],mi)=>{(byProj[project]=byProj[project]||[]).push(mi);});
        const lv=[],lc=[];
        for (const [proj,indices] of Object.entries(byProj)){if(indices.length<2) continue;const c=projectColor.get(proj)??new THREE.Color(0.5,0.5,0.5);const step=Math.max(1,Math.ceil(indices.length/40));for(let i=0;i+step<indices.length;i+=step){const m1=indices[i],m2=indices[i+step];lv.push(pos[m1*3],pos[m1*3+1],pos[m1*3+2],pos[m2*3],pos[m2*3+1],pos[m2*3+2]);lc.push(c.r,c.g,c.b,c.r,c.g,c.b);}}
        if (lv.length){const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));lg.setAttribute('color',new THREE.Float32BufferAttribute(lc,3));const lo=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.0}));lo.renderOrder=1;viewAGroup.add(lo);clLineSeg[ci]=lo;}
      });
    }

    // ── View B: Project nodes ─────────────────────────────────────────────────
    const prNodeMesh = [];
    const viewBNodes = [];
    const prInstMesh = [];
    const prLineSeg  = [];
    const prMeta     = [];
    const prPosVec   = [];

    projEntries.forEach(({proj,pi,pos,color,total,maxProjSize},i)=>{
      prPosVec.push(new THREE.Vector3(...pos));
      const radius=0.05+(total/maxProjSize)*0.22;
      const mat=new THREE.MeshPhongMaterial({color,emissive:color,emissiveIntensity:0.45,shininess:80,transparent:true,opacity:0.9});
      const mesh=new THREE.Mesh(new THREE.SphereGeometry(radius,12,8),mat);
      mesh.position.set(...pos); viewBGroup.add(mesh); prNodeMesh.push(mesh);
      const hMat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.09});
      const halo=new THREE.Mesh(new THREE.TorusGeometry(radius*3,0.01,6,48),hMat);
      halo.position.set(...pos); halo.rotation.set(rngPr()*Math.PI,rngPr()*Math.PI,0); viewBGroup.add(halo);
      const name=projectName(proj);
      viewBNodes.push({mesh,label:`${name}  ·  ${total.toLocaleString()} msgs`,type:'project',baseEmissive:0.45,color,proj});
      // Message cloud: cluster-colored spheres around project node
      const msgs=byProject[proj]||[];
      if (!msgs.length) return;
      const jitterR=0.4+(total/maxProjSize)*1.5;
      const mpos=new Float32Array(msgs.length*3);
      for (let m=0;m<msgs.length;m++){const theta=rngPr()*Math.PI*2,phi=Math.acos(2*rngPr()-1),r=rngPr()*jitterR;mpos[m*3]=pos[0]+r*Math.sin(phi)*Math.cos(theta);mpos[m*3+1]=pos[1]+r*Math.sin(phi)*Math.sin(theta);mpos[m*3+2]=pos[2]+r*Math.cos(phi);}
      const mmat=new THREE.MeshPhongMaterial({color:0xffffff,shininess:70,transparent:true,opacity:0.0});
      const inst=new THREE.InstancedMesh(sphereGeo,mmat,msgs.length); inst.renderOrder=1;
      for (let m=0;m<msgs.length;m++){dummy.position.set(mpos[m*3],mpos[m*3+1],mpos[m*3+2]);dummy.updateMatrix();inst.setMatrixAt(m,dummy.matrix);inst.setColorAt(m,new THREE.Color(PALETTE[msgs[m][2]%PALETTE.length]));}
      inst.instanceMatrix.needsUpdate=true; inst.instanceColor.needsUpdate=true;
      viewBGroup.add(inst); prInstMesh.push(inst); prMeta.push(msgs);
      // Cluster-colored connection chains within project
      const byCI={};
      msgs.forEach(([,,ci],mi)=>{(byCI[ci]=byCI[ci]||[]).push(mi);});
      const lv=[],lc=[];
      for (const [ci_s,indices] of Object.entries(byCI)){if(indices.length<2)continue;const c=new THREE.Color(PALETTE[+ci_s%PALETTE.length]);const step=Math.max(1,Math.ceil(indices.length/40));for(let i=0;i+step<indices.length;i+=step){const m1=indices[i],m2=indices[i+step];lv.push(mpos[m1*3],mpos[m1*3+1],mpos[m1*3+2],mpos[m2*3],mpos[m2*3+1],mpos[m2*3+2]);lc.push(c.r,c.g,c.b,c.r,c.g,c.b);}}
      if(lv.length){const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));lg.setAttribute('color',new THREE.Float32BufferAttribute(lc,3));const lo=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.0}));lo.renderOrder=1;viewBGroup.add(lo);prLineSeg.push(lo);}else{prLineSeg.push(null);}
    });

    // ── LOD constants ─────────────────────────────────────────────────────────
    const LOD_NEAR=4.5, LOD_FAR=8.5;

    // ── Controls ──────────────────────────────────────────────────────────────
    const controls=new OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true; controls.dampingFactor=0.04;
    controls.minDistance=0.8; controls.maxDistance=65;
    controls.autoRotate=true; controls.autoRotateSpeed=0.4;

    const rotateBtn=document.getElementById('rotateBtn');
    function setAutoRotate(on){controls.autoRotate=on;rotateBtn.textContent=on?'⟳ AUTO-ROTATE':'⏸ AUTO-ROTATE';rotateBtn.classList.toggle('paused',!on);}
    rotateBtn.addEventListener('click',()=>setAutoRotate(!controls.autoRotate));
    renderer.domElement.addEventListener('pointerdown',()=>{if(controls.autoRotate)setAutoRotate(false);});

    // ── Raycasting / tooltip ──────────────────────────────────────────────────
    const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2(-9,-9);
    const tooltip=document.getElementById('tooltip');
    let hovered=-1, hoveredPt=null, lastMx=0, lastMy=0;
    renderer.domElement.addEventListener('pointermove',e=>{mouse.x=(e.clientX/window.innerWidth)*2-1;mouse.y=-(e.clientY/window.innerHeight)*2+1;lastMx=e.clientX;lastMy=e.clientY;});

    function showTooltip(text,col,px,py){tooltip.style.display='block';tooltip.style.color=col;tooltip.style.borderColor=col+'88';tooltip.style.left=Math.min(px+14,window.innerWidth-400)+'px';tooltip.style.top=Math.max(py-10,8)+'px';tooltip.textContent=text;}

    // ── View switching ────────────────────────────────────────────────────────
    let currentView='A';
    const btnA=document.getElementById('btnA'), btnB=document.getElementById('btnB');
    const legendEl=document.getElementById('legend');
    const hintEl=document.getElementById('hint');

    function buildLegendA(){
      legendEl.innerHTML='';
      clusters.forEach((cl,i)=>{const hex=colorHex(new THREE.Color(PALETTE[i%PALETTE.length]));const terms=cl.label.split(' · ').slice(0,4).join(' · ');const item=document.createElement('div');item.className='legend-item';item.innerHTML=`<div class="legend-dot" style="background:${hex};box-shadow:0 0 5px ${hex}88"></div><span>${terms}</span>`;legendEl.appendChild(item);});
      const s=document.createElement('div');s.className='legend-item';s.style.marginTop='5px';s.innerHTML=`<div class="legend-dot" style="background:#aaaacc;opacity:0.55"></div><span style="opacity:0.5">void saddle</span>`;legendEl.appendChild(s);
      if(topo.topology){const b=document.createElement('div');b.className='legend-item';b.style.opacity='0.3';b.textContent=`B₀=${topo.topology.B0_isolated_voids}  B₁=${topo.topology.B1_orbital_voids}`;legendEl.appendChild(b);}
      if(ptsData){const sep=document.createElement('div');sep.style.cssText='height:1px;background:rgba(255,255,255,0.08);margin:6px 0';legendEl.appendChild(sep);const h=document.createElement('div');h.className='legend-item';h.style.cssText='opacity:0.3;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:2px';h.textContent='messages by project';legendEl.appendChild(h);projectColor.forEach((col,proj)=>{const hex=colorHex(col);const item=document.createElement('div');item.className='legend-item';item.innerHTML=`<div class="legend-dot" style="background:${hex};box-shadow:0 0 4px ${hex}88"></div><span style="opacity:0.6">${projectName(proj)}</span>`;legendEl.appendChild(item);});}
    }

    function buildLegendB(){
      legendEl.innerHTML='';
      const h=document.createElement('div');h.className='legend-item';h.style.cssText='opacity:0.3;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:4px';h.textContent='messages by cluster';legendEl.appendChild(h);
      clusters.forEach((cl,i)=>{const hex=colorHex(new THREE.Color(PALETTE[i%PALETTE.length]));const terms=cl.label.split(' · ').slice(0,3).join(' / ');const item=document.createElement('div');item.className='legend-item';item.innerHTML=`<div class="legend-dot" style="background:${hex};box-shadow:0 0 5px ${hex}88"></div><span>${terms}</span>`;legendEl.appendChild(item);});
      const sep=document.createElement('div');sep.style.cssText='height:1px;background:rgba(255,255,255,0.08);margin:6px 0';legendEl.appendChild(sep);
      const h2=document.createElement('div');h2.className='legend-item';h2.style.cssText='opacity:0.3;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:2px';h2.textContent='project nodes';legendEl.appendChild(h2);
      projEntries.forEach(({proj,color,total})=>{const hex=colorHex(color);const item=document.createElement('div');item.className='legend-item';item.innerHTML=`<div class="legend-dot" style="background:${hex};box-shadow:0 0 4px ${hex}88"></div><span style="opacity:0.6">${projectName(proj)} <span style="opacity:0.5">(${total.toLocaleString()})</span></span>`;legendEl.appendChild(item);});
    }

    function switchView(v){
      currentView=v;
      viewAGroup.visible=(v==='A'); viewBGroup.visible=(v==='B');
      btnA.classList.toggle('active',v==='A'); btnB.classList.toggle('active',v==='B');
      hovered=-1; hoveredPt=null; tooltip.style.display='none';
      camera.position.set(4,6,30); controls.target.set(0,0,0);
      if(v==='A') buildLegendA(); else buildLegendB();
    }

    btnA.addEventListener('click',()=>switchView('A'));
    btnB.addEventListener('click',()=>switchView('B'));
    buildLegendA();

    window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

    // ── Animate ───────────────────────────────────────────────────────────────
    const clock=new THREE.Clock();
    let wasZoomed=false;

    function animate(){
      requestAnimationFrame(animate);
      const t=clock.getElapsedTime();

      // LOD
      let nearestIdx=-1, nearestDist=Infinity;
      let activePtMeshes, activePtMeta, activeNodeMesh;

      if (currentView==='A'){
        activePtMeshes=clInstMesh; activePtMeta=clMeta; activeNodeMesh=clNodeMesh;
        clusters.forEach((cl,ci)=>{
          const dist=camera.position.distanceTo(clusterPosVec[ci]);
          const lodT=1-clamp((dist-LOD_NEAR)/(LOD_FAR-LOD_NEAR),0,1);
          if(clInstMesh[ci]) clInstMesh[ci].material.opacity=lodT*0.88;
          if(clLineSeg[ci])  clLineSeg[ci].material.opacity=lodT*0.28;
          clNodeMesh[ci].material.opacity=0.08+(1-lodT)*0.82;
          if(dist<nearestDist){nearestDist=dist;nearestIdx=ci;}
        });
      } else {
        activePtMeshes=prInstMesh; activePtMeta=prMeta; activeNodeMesh=prNodeMesh;
        projEntries.forEach((_,pi)=>{
          const dist=camera.position.distanceTo(prPosVec[pi]);
          const lodT=1-clamp((dist-LOD_NEAR)/(LOD_FAR-LOD_NEAR),0,1);
          if(prInstMesh[pi]) prInstMesh[pi].material.opacity=lodT*0.88;
          if(prLineSeg[pi])  prLineSeg[pi].material.opacity=lodT*0.28;
          prNodeMesh[pi].material.opacity=0.08+(1-lodT)*0.82;
          if(dist<nearestDist){nearestDist=dist;nearestIdx=pi;}
        });
      }

      const isZoomed=nearestDist<LOD_NEAR+1;
      if(isZoomed!==wasZoomed){hintEl.innerHTML=isZoomed?'hover messages to read &bull; scroll to pull back':'drag &bull; scroll to zoom<br>zoom into node to read messages';wasZoomed=isZoomed;}

      // Raycasting
      raycaster.setFromCamera(mouse,camera);
      const activeNodes=currentView==='A'?viewANodes:viewBNodes;
      const activeMeshes=activeNodes.map(n=>n.mesh);

      let ptHit=null;
      if(nearestIdx>=0&&nearestDist<LOD_NEAR&&activePtMeshes[nearestIdx]){
        const pHits=raycaster.intersectObject(activePtMeshes[nearestIdx]);
        if(pHits.length>0) ptHit={idx:nearestIdx,inst:pHits[0].instanceId};
      }

      if(ptHit!=null&&activePtMeta[ptHit.idx]?.[ptHit.inst]){
        if(hovered>=0){const o=activeNodes[hovered];o.mesh.material.emissiveIntensity=o.baseEmissive;o.mesh.scale.setScalar(1);if(o.type==='saddle')o.mesh.material.opacity=0.25+o.voidScore*0.22;hovered=-1;}
        if(!hoveredPt||hoveredPt.idx!==ptHit.idx||hoveredPt.inst!==ptHit.inst){
          hoveredPt=ptHit;
          const entry=activePtMeta[ptHit.idx][ptHit.inst];
          const [text,project,ci,sub]=entry;
          let label,col;
          if(currentView==='A'){
            col=colorHex(projectColor.get(project)??new THREE.Color(0.5,0.5,0.5));
            label=(project?`[${projectName(project)}${sub?' / '+sub:''}]\n`:'')+text;
          } else {
            col=colorHex(new THREE.Color(PALETTE[(ci??0)%PALETTE.length]));
            const clLabel=clusters[ci??0]?.label.split(' · ').slice(0,2).join(' / ')||'';
            label=(clLabel?`[${clLabel}]${sub?'  ·  '+sub:''}\n`:'')+text;
          }
          showTooltip(label,col,lastMx,lastMy);
        }
      } else {
        hoveredPt=null;
        const hits=raycaster.intersectObjects(activeMeshes);
        const newHov=hits.length>0?activeMeshes.indexOf(hits[0].object):-1;
        if(newHov!==hovered){
          if(hovered>=0){const o=activeNodes[hovered];o.mesh.material.emissiveIntensity=o.baseEmissive;o.mesh.scale.setScalar(1);if(o.type==='saddle')o.mesh.material.opacity=0.25+o.voidScore*0.22;}
          hovered=newHov;
          if(hovered>=0){const c=activeNodes[hovered];if(c.type==='saddle'){c.mesh.material.emissiveIntensity=0.55;c.mesh.material.opacity=0.90;c.mesh.scale.setScalar(1.8);}else{c.mesh.material.emissiveIntensity=1.15;c.mesh.scale.setScalar(1.4);}}
        }
        if(hovered>=0){
          const n=activeNodes[hovered];
          const col=n.type==='saddle'?'#aaaacc':colorHex(n.color);
          const sp=hits[0].object.position.clone().project(camera);
          const px=(sp.x*.5+.5)*window.innerWidth,py=(-sp.y*.5+.5)*window.innerHeight;
          showTooltip(n.label,col,px,py);
        } else { tooltip.style.display='none'; }
      }

      // Pulse
      activeNodes.forEach((n,i)=>{
        if(i===hovered) return;
        if(n.type==='saddle'){const ph=(i*.73)%(Math.PI*2);n.mesh.material.emissiveIntensity=n.baseEmissive+.05*Math.sin(t*.32+ph);n.mesh.material.opacity=.25+n.voidScore*.22+.04*Math.sin(t*.32+ph);}
        else{const ph=(i*.67)%(Math.PI*2);n.mesh.material.emissiveIntensity=.38+.14*Math.sin(t*.85+ph);}
      });

      controls.update();
      renderer.render(scene,camera);
    }
    animate();
  </script>
</body>
</html>
